<section class="event-log">
  <header class="event-log__header">
    <h3 class="event-log__title">Журнал событий</h3>
    <div class="event-log__actions">
      @if (log().length > 0) {
        <button
          class="btn btn--ghost event-log__clear"
          [class.event-log__clear--confirming]="confirming()"
          type="button"
          (click)="onClearClick()"
        >
          {{ confirming() ? 'Точно очистить?' : 'Очистить' }}
        </button>
      }
      <span class="event-log__count">{{ log().length }}/20</span>
    </div>
  </header>

  <ol class="event-log__list">
    @for (event of log(); track event.id) {
      <li [class]="'event-log__item event-log__item--' + event.type">
        <time class="event-log__time">{{ formatTime(event.timestamp) }}</time>
        <span class="event-log__badge">{{ typeLabels[event.type] }}</span>
        <span class="event-log__message">{{ event.message }}</span>
      </li>
    } @empty {
      <li class="event-log__empty">Событий пока нет — добавьте продукт.</li>
    }
  </ol>
</section>
